[project]
name = "segmentation-service"
version = "0.1.0"
description = "SAM-3 segmentation service for remote-sensing imagery"
requires-python = ">=3.11"
dependencies = ["segmentation-api", "segmentation-finetune[db]"]

[tool.uv]
package = false

[tool.uv.sources]
segmentation-api = { workspace = true }
segmentation-finetune = { workspace = true }

[tool.uv.workspace]
members = ["services/api", "services/finetune"]

[dependency-groups]
dev = ["pytest>=8.0", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["services/api/tests", "services/finetune/tests"]
