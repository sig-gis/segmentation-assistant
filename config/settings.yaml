model:
  # Only "samgeo" is implemented. The Backend interface exists so sam2 /
  # grounding-dino could be added later; do not add stub entries here.
  backend: samgeo
  # Passed to samgeo SamGeo3(backend=...): "meta" or "transformers".
  # "meta" supports both facebook/sam3 and facebook/sam3.1.
  samgeo_backend: meta
  model_id: facebook/sam3
  # Optional fine-tuned adapter to load on top of the base checkpoint.
  # Set to an HF Hub ref recorded in training_runs.hf_checkpoint_ref
  # (e.g. "your-org/sam3-rs-lora@run-<uuid>"). Checkpoint selection is a
  # config value, not a code change.
  adapter_ref: null

tiling:
  tile_size: 1008
  overlap: 126
  # Sweeps drop objects outside these areas (px²), measured after pieces cut
  # by tile edges are joined. null = no limit.
  min_size: 0
  max_size: null

interactive:
  multimask_output: true

concept:
  # /segment/concept: lowest match score kept, unless a request sets its own.
  # SAM-3's built-in 0.5 hides most matches for an exemplar on satellite images.
  min_score: 0.3

# Fine-tune options (backend local/slurm, split fractions, LoRA r/alpha/dropout)
# are seg-finetune CLI flags, not settings here. See "Fine-tuning" in the
# README.
