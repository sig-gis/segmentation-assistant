server {
    listen 80;
    root /usr/share/nginx/html;
    client_max_body_size 2g;  # image uploads

    # Same-origin API: the browser calls /api/..., nginx forwards to the api service.
    location /api/ {
        proxy_pass http://api:8000/;
        proxy_set_header Host $host;
        proxy_read_timeout 600s;  # find similar on a large image can take a while
    }

    location / {
        try_files $uri /index.html;
    }
}
