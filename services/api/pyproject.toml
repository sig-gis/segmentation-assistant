[project]
name = "segmentation-api"
version = "0.1.0"
description = "SAM-3 remote-sensing segmentation API (FastAPI)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "asyncpg>=0.29",
    "numpy>=1.26",
    "rasterio>=1.3",
    "pillow>=10.0",
    "shapely>=2.0",
    "python-multipart>=0.0.9",  # image uploads (multipart form data)
]

[project.optional-dependencies]
# Runtime model stack. NOT needed for the test suite (the Backend layer is
# mocked); needed only when actually serving inference. Pulls in torch; install
# sam3 from vendor/sam3 first (the PyPI `sam3` name is an empty placeholder).
ml = [
    "segment-geospatial[samgeo3]>=0.12",
]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
