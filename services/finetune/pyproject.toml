[project]
name = "segmentation-finetune"
version = "0.1.0"
description = "Dataset export, LoRA fine-tuning and checkpoint publishing for the SAM-3 segmentation service"
requires-python = ">=3.11"
# Core deps cover the dataset-export path (DB -> COCO folders), which runs and
# is tested without any model stack.
dependencies = [
    "attrs>=23.2",  # affine 3 caches properties on attrs slotted classes
    "numpy>=1.26",
    "pyyaml>=6.0",
    "pillow>=10.0",
    "rasterio>=1.3",
    "shapely>=2.0",
]

[project.optional-dependencies]
# Reading annotations straight from the service's Postgres.
db = ["psycopg[binary]>=3.1"]
# Training/eval/publishing stack. The vendored checkout must ALSO be installed:
#   pip install -e vendor/sam3[train]
# (the PyPI `sam3` wheel lacks the training configs).
train = [
    "torch>=2.2",
    "peft>=0.10",
    "tensorboard>=2.15",
    "huggingface_hub>=0.23",
]
dev = ["pytest>=8.0"]

[project.scripts]
seg-finetune = "finetune.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["finetune*"]

[tool.setuptools.package-data]
finetune = ["configs/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
